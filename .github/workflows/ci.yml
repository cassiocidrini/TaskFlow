name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Menor privilégio: o CI só precisa LER o código (OWASP A08 — integridade do pipeline)
permissions:
  contents: read

# Novo push no mesmo PR cancela o run anterior (não gasta minutos validando código obsoleto)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Três jobs PARALELOS. Cada teste roda UMA vez. Todos obrigatórios na Branch Protection:
# nenhum merge sem tudo verde.
jobs:
  quality:
    name: Tipos, lint, unitários e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate

      - name: Verificar tipos (tsc)
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Testes unitários
        run: npm run test:unit
      - name: Build
        run: npm run build

  integration:
    name: Testes de integração (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate

      - name: Testes de integração (Postgres real)
        run: npm run test:integration

  e2e:
    name: Testes E2E (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate

      - name: Testes E2E (HTTP + Postgres real)
        run: npm run test:e2e
