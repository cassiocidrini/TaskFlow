name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Menor privilégio: o CI só precisa LER o código (OWASP A08 — integridade do pipeline)
permissions:
  contents: read

# Novo push no mesmo PR cancela o run anterior (não gasta minutos validando código obsoleto)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Cinco jobs PARALELOS. Cada teste roda UMA vez. Todos obrigatórios na Branch Protection:
# nenhum merge sem tudo verde.
jobs:
  quality:
    name: Tipos, lint, unitários e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate

      - name: Verificar tipos (tsc)
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Testes unitários
        run: npm run test:unit
      # Build + o contrato da API (Módulo 14.3): falha se o código mudou o OpenAPI e docs/api/openapi.json não foi
      # atualizado no mesmo PR. Do código COMPILADO, porque o plugin do Swagger só roda no `nest build`
      - name: Build e contrato da API (snapshot do OpenAPI)
        run: npm run openapi:check

  integration:
    name: Testes de integração (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate

      - name: Testes de integração (Postgres real)
        run: npm run test:integration

  e2e:
    name: Testes E2E (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate

      - name: Testes E2E (HTTP + Postgres real)
        run: npm run test:e2e

  # Módulo 13: outbox → relay → Kafka com broker e banco REAIS. Job próprio porque é a única suíte que sobe um
  # Kafka (~400 MB, ~10 s): as outras não pagam esse custo, e uma falha aqui aponta direto para a mensageria.
  streaming:
    name: Testes de streaming (Kafka + Postgres, Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate

      - name: Testes de streaming (relay publicando no Kafka)
        run: npm run test:streaming

  # Etapa E.1: a imagem de produção é construída e RODADA em todo PR. O Dockerfile anterior ficou no Node 20, como
  # root e copiando o .env para o build sem ninguém perceber, porque nada o executava. Sem `npm ci`: o smoke só usa
  # o Docker e módulos nativos do Node (a imagem instala as próprias dependências).
  image:
    name: Imagem Docker (hadolint e smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Lint do Dockerfile (hadolint)
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile
      # Migração num Postgres vazio, healthy, ready 200, uid 1000, sem escrita no código, sem npm, docker stop com
      # graceful shutdown (exit 0 em menos de 5 s)
      - name: Smoke da imagem (build + execução)
        run: npm run docker:smoke
