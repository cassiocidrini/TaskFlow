# Versões FIXAS (nunca :latest): o mesmo compose sobe o mesmo ambiente em qualquer máquina e em qualquer dia.
# Atualizar = trocar a tag aqui num PR revisado. São as versões que já rodavam quando a fixação foi feita.
services:
  postgres:
    image: postgres:16.15
    container_name: taskflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow123
      POSTGRES_DB: taskflow_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # "Container de pé" não é "banco aceitando conexões": o Postgres leva alguns segundos para iniciar.
    # Com o healthcheck, `docker compose up --wait` (npm run infra:up) só retorna quando o banco está pronto.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow_db"]
      interval: 2s
      timeout: 3s
      retries: 30

  jaeger:
    # Jaeger v1 está descontinuado; a migração para o v2 (jaegertracing/jaeger) é um passo à parte
    image: jaegertracing/all-in-one:1.76.0
    container_name: taskflow-jaeger
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: taskflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    # A API roda no host (npm run dev) e o prometheus.yml coleta de host.docker.internal:9464.
    # O Docker Desktop (macOS/Windows) cria esse nome sozinho; o Docker Engine do Linux não.
    # `host-gateway` é o IP do host na rede bridge: o mesmo prometheus.yml funciona nas três plataformas.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:13.2.3
    container_name: taskflow-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    # Dashboard como código: datasources e dashboards vêm de arquivos versionados (grafana/), somente leitura.
    # Um ambiente novo sobe já observável, sem importar JSON na mão.
    volumes:
      - grafana_data:/var/lib/grafana
      # Só as subpastas usadas: montar provisioning/ inteira esconderia as pastas vazias da imagem (plugins/,
      # alerting/) e o Grafana registraria erro no boot por não encontrá-las
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

  localstack:
    image: localstack/localstack:2026.9.0
    container_name: taskflow-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,s3,dynamodb,sns,iam
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - localstack_data:/var/lib/localstack

volumes:
  postgres_data:
  grafana_data:
  localstack_data: