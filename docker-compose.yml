# Versões FIXAS (nunca :latest): o mesmo compose sobe o mesmo ambiente em qualquer máquina e em qualquer dia.
# Atualizar = trocar a tag aqui num PR revisado. São as versões que já rodavam quando a fixação foi feita.
services:
  postgres:
    image: postgres:16.15
    container_name: taskflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow123
      POSTGRES_DB: taskflow_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # "Container de pé" não é "banco aceitando conexões": o Postgres leva alguns segundos para iniciar.
    # Com o healthcheck, `docker compose up --wait` (npm run infra:up) só retorna quando o banco está pronto.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow_db"]
      interval: 2s
      timeout: 3s
      retries: 30

  jaeger:
    # Jaeger v1 está descontinuado; a migração para o v2 (jaegertracing/jaeger) é um passo à parte
    image: jaegertracing/all-in-one:1.76.0
    container_name: taskflow-jaeger
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: taskflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    # A API roda no host (npm run dev) e o prometheus.yml coleta de host.docker.internal:9464.
    # O Docker Desktop (macOS/Windows) cria esse nome sozinho; o Docker Engine do Linux não.
    # `host-gateway` é o IP do host na rede bridge: o mesmo prometheus.yml funciona nas três plataformas.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:13.2.3
    container_name: taskflow-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    # Dashboard como código: datasources e dashboards vêm de arquivos versionados (grafana/), somente leitura.
    # Um ambiente novo sobe já observável, sem importar JSON na mão.
    volumes:
      - grafana_data:/var/lib/grafana
      # Só as subpastas usadas: montar provisioning/ inteira esconderia as pastas vazias da imagem (plugins/,
      # alerting/) e o Grafana registraria erro no boot por não encontrá-las
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

  # ------------------------------------------------------------------------------------------------------------
  # Kafka (Módulo 13) — profile "streaming": só sobe com `npm run streaming:up`. Quem não está trabalhando com
  # mensageria não paga ~700 MB de RAM nem o boot da JVM no `npm run dev` e nos testes.
  # ------------------------------------------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.3.2
    container_name: taskflow-kafka
    profiles: ["streaming"]
    ports:
      - "9092:9092" # listener EXTERNAL: a API e os scripts rodando no host
    environment:
      # KRaft (sem ZooKeeper, que o Kafka 4 nem suporta mais): este nó é broker E controller do próprio cluster
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # DOIS listeners de cliente: o broker devolve ao cliente o endereço ANUNCIADO, e ele precisa resolver de
      # onde o cliente está. Do host, "localhost:9092"; de outro container, "kafka:29092". Com um só, um dos
      # dois lados receberia um endereço que não alcança o broker (o erro clássico de Kafka em Docker).
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Tópico é CONTRATO: criado explicitamente (kafka-init). Com autocriação, um nome digitado errado no
      # produtor criaria outro tópico, e o consumidor ficaria esperando no certo, em silêncio.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Um nó só: tópicos internos (offsets dos consumer groups, transações) com réplica 1.
      # Em produção: 3 brokers, RF 3, min.insync.replicas 2.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0 # dev: o 1º consumidor não espera 3 s pelo rebalance inicial
      KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m" # o default da imagem é 1 GB; em dev, 384 MB bastam
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data # o log sobrevive a reinícios (o replay do 13.6 depende disso)
    # "Container de pé" não é "broker aceitando clientes": a JVM e o KRaft levam alguns segundos.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 10s

  # Execução única: cria os tópicos e sai. Idempotente (--if-not-exists): rodar de novo não muda nada.
  # O contrato do tópico fica versionado aqui: nome com .v1 (um v2 incompatível convive durante a migração),
  # 3 partições (unidade de paralelismo E de ordem) e retenção de 7 dias (o Kafka não é a fonte da verdade:
  # o Event Store é; reconstruir tudo = republicar da tabela events).
  kafka-init:
    image: apache/kafka:4.3.2
    container_name: taskflow-kafka-init
    profiles: ["streaming"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic taskflow.task-events.v1 --partitions 3 --replication-factor 1 \
          --config retention.ms=604800000 --config cleanup.policy=delete
        # Dead-letter topic do consumer group notifications (Módulo 13.5): um por GRUPO, e não por tópico de origem
        # (a falha é do consumer; reprocessar de um DLT compartilhado reentregaria a todos os grupos). Retenção de
        # 30 dias, maior que a do tópico de origem: é o prazo para alguém investigar
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic taskflow.notifications-dlt.v1 --partitions 3 --replication-factor 1 \
          --config retention.ms=2592000000 --config cleanup.policy=delete
        # Tópico só do smoke test (npm run kafka:smoke): mensagem de teste nunca vai para o tópico de eventos
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic taskflow.smoke --partitions 1 --replication-factor 1 --config retention.ms=3600000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe --topic taskflow.task-events.v1

  localstack:
    image: localstack/localstack:2026.9.0
    container_name: taskflow-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,s3,dynamodb,sns,iam
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - localstack_data:/var/lib/localstack

volumes:
  postgres_data:
  grafana_data:
  kafka_data:
  localstack_data: