# Configuração NÃO sensível da API (Módulo 02, etapa 2.2). Vai para o Git como qualquer manifesto.
#
# O que é sensível (a senha do banco e o JWT_SECRET) fica nos Secrets `taskflow-db` e `taskflow-api`, criados por
# comando e nunca versionados: um Secret do Kubernetes é só base64, e qualquer um que leia o objeto (ou o Git) lê o
# valor. Em produção, o valor vem de um cofre (External Secrets Operator + AWS Secrets Manager/Vault) ou vai cifrado
# para o Git (Sealed Secrets, SOPS).
#
# O que não está aqui usa o padrão do schema de ambiente (src/config/env.schema.ts); a lista completa está no
# .env.example. Mesmo contrato do desenvolvimento: só muda de onde as variáveis vêm (12-Factor).
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-api
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-api
    app.kubernetes.io/part-of: taskflow
data:
  # Produção: Swagger desligado, e o LOG_PRETTY recusado pelo schema
  NODE_ENV: production
  LOG_LEVEL: info
  # Ainda não há coletor (Jaeger) dentro do cluster: com o SDK ligado, o exporter tentaria localhost:4318 a cada lote
  OTEL_SDK_DISABLED: 'true'
