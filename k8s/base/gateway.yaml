# A entrada do TaskFlow pela Gateway API (Módulo 02, etapa 2.5), implementada pelo Envoy Gateway.
#
#   cliente ─► IP do LoadBalancer (cloud-provider-kind) ─► Envoy (envoy-gateway-system) ─► pods da API (taskflow)
#
# Gateway API, e não Ingress (ADR-0015): o `Ingress` está congelado, e o controller mais usado dele (ingress-nginx) foi
# aposentado pelo projeto Kubernetes. A Gateway API separa PAPÉIS em objetos diferentes:
#   GatewayClass  qual implementação atende (o time de plataforma escolhe: aqui, o Envoy Gateway)
#   Gateway       a porta de entrada: endereço, porta, protocolo, hostnames aceitos (plataforma)
#   HTTPRoute     para onde vai cada requisição (o time da aplicação, no namespace dele)
#
# Pré-requisitos, instalados por versão e fora deste repositório (Módulo 02, "Como reproduzir", 15): os CRDs da
# Gateway API v1.6.3 (canal standard), o Envoy Gateway v1.10.0 e o cloud-provider-kind v0.12.0.
---
# Objeto de cluster (sem namespace): "o controller do Envoy Gateway atende os Gateways desta classe"
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
  labels:
    app.kubernetes.io/part-of: taskflow
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
# O Envoy Gateway cria, para este Gateway, um Deployment do Envoy e um Service `type: LoadBalancer` no namespace dele
# (envoy-gateway-system). O cloud-provider-kind dá IP a esse Service, como um balanceador de nuvem faria
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: taskflow
  namespace: taskflow
  labels:
    app.kubernetes.io/part-of: taskflow
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # Só este host: requisição com outro `Host` recebe 404 do próprio Envoy, sem chegar à API
      hostname: taskflow.local
      # Só rotas do MESMO namespace podem se pendurar neste listener: outro time não publica nada no nosso host
      allowedRoutes:
        namespaces:
          from: Same
---
# Toda requisição para taskflow.local vai para o Service da API. O Envoy não passa pelo IP virtual do Service: ele lê
# o EndpointSlice e balanceia direto entre os IPs dos pods prontos (o mesmo "pronto" da readiness da 2.3)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskflow-api
  namespace: taskflow
  labels:
    app.kubernetes.io/name: taskflow-api
    app.kubernetes.io/part-of: taskflow
spec:
  parentRefs:
    - name: taskflow
      sectionName: http
  hostnames:
    - taskflow.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: taskflow-api
          port: 80
