global:
  scrape_interval: 5s
  # Regras avaliadas no mesmo ritmo da coleta: um alerta reage em segundos, não no padrão de 1 min
  evaluation_interval: 5s

# Alertas como código (Módulo 13.6d). Testados com `promtool test rules` (test/integration/alert-rules.spec.ts)
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'taskflow'
    static_configs:
      - targets: ['host.docker.internal:9464']

  # Relay da outbox (Módulo 13.3): processo separado, com a própria porta de métricas. Fora do ar quando o relay
  # não está rodando — `up{job="taskflow-relay"} == 0` é, ele mesmo, o primeiro sinal de alerta do relay.
  - job_name: 'taskflow-relay'
    static_configs:
      - targets: ['host.docker.internal:9465']

  # Consumer group `notifications` (Módulo 13.4): outro processo, outra porta
  - job_name: 'taskflow-notifications'
    static_configs:
      - targets: ['host.docker.internal:9467']

  # Consumer group `reports` (Módulo 13.6a): mesmo tópico, outro grupo, outro processo
  - job_name: 'taskflow-reports'
    static_configs:
      - targets: ['host.docker.internal:9468']

  # Lag dos consumer groups e tamanho dos DLTs, vistos pelo broker (Módulo 13.6d). Pela rede do compose, e não pelo
  # host: o exporter roda em container (profile `streaming`). Sem o Kafka de pé, este alvo fica `down`
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']
